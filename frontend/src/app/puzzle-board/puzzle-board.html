<div class="relative aspect-square w-full [container-type:inline-size]">
  @if (ring() !== null) {
    <svg class="absolute inset-0 h-full w-full" viewBox="0 0 100 100" fill="none">
      <rect x="1.5" y="1.5" width="97" height="97" rx="12" pathLength="100"
            stroke="currentColor" stroke-opacity="0.1" stroke-width="1.2" />
      <rect x="1.5" y="1.5" width="97" height="97" rx="12" pathLength="100"
            stroke="#0a84ff" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="100"
            [attr.stroke-dashoffset]="100 - ring()! * 100" class="transition-all duration-500" />
    </svg>
  }
  <div class="absolute" [class]="ring() === null ? 'inset-0' : 'inset-[6%]'">
    @for (n of tiles; track n) {
      <div class="absolute left-0 top-0 h-1/3 w-1/3 p-[1.5%] transition-transform duration-500 ease-[cubic-bezier(.22,1,.36,1)]"
           [style.transform]="tf(n)">
        <button type="button" class="tile" [disabled]="!interactive()"
                [class.hint]="hint() === n" [class.placed]="placed(n)" (click)="tileClick.emit(n)">{{ n }}</button>
      </div>
    }
  </div>
</div>
