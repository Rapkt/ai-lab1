<!-- Soft colour behind the glass so the blur has something to show -->
<div class="fixed inset-0 -z-10 overflow-hidden bg-bg transition-colors duration-500">
  <div class="absolute -left-24 -top-32 h-96 w-96 rounded-full bg-sky-300/40 blur-3xl animate-[drift_22s_ease-in-out_infinite_alternate] dark:bg-sky-500/25"></div>
  <div class="absolute -right-24 top-1/3 h-96 w-96 rounded-full bg-violet-300/40 blur-3xl animate-[drift_28s_ease-in-out_infinite_alternate-reverse] dark:bg-violet-500/25"></div>
  <div class="absolute -bottom-32 left-1/3 h-96 w-96 rounded-full bg-pink-200/50 blur-3xl animate-[drift_25s_ease-in-out_infinite_alternate] dark:bg-pink-500/20"></div>
</div>

<main class="mx-auto max-w-5xl px-5 py-8 text-fg">
  <header class="mb-6 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <svg class="h-11 w-11 text-fg" viewBox="0 0 30 30" aria-hidden="true">
        @for (p of logo; track $index) {
          <rect [attr.x]="p[0]" [attr.y]="p[1]" width="8" height="8" rx="2.3"
                [attr.fill]="$index === 0 ? '#0a84ff' : 'currentColor'" [attr.opacity]="$index === 0 ? 1 : 0.78"
                [class.logo-slide]="$index === 0" />
        }
      </svg>
      <div>
        <h1 class="bg-linear-to-b from-fg to-fg/55 bg-clip-text text-4xl font-semibold tracking-tight text-transparent">8-Puzzle</h1>
        <p class="text-muted">Search algorithms, made visible.</p>
      </div>
    </div>
    <div class="flex gap-2">
      <button class="round-btn" (click)="sound.muted.set(!sound.muted())"
              [attr.aria-label]="sound.muted() ? 'Unmute' : 'Mute'"><app-icon [name]="sound.muted() ? 'mute' : 'volume'" /></button>
      <button class="round-btn" (click)="dark.set(!dark())"
              [attr.aria-label]="dark() ? 'Light mode' : 'Dark mode'"><app-icon [name]="dark() ? 'sun' : 'moon'" /></button>
    </div>
  </header>

  <div class="seg mx-auto mb-8 max-w-md" [style.--n]="modes.length" role="tablist">
    <span class="seg-pill" [style.transform]="'translateX(' + modeIndex() * 100 + '%)'"></span>
    @for (m of modes; track m.id) {
      <button (click)="mode.set(m.id)" role="tab" [attr.aria-selected]="mode() === m.id"
              class="seg-item" [class.active]="mode() === m.id">{{ m.label }}</button>
    }
  </div>

  @switch (mode()) {
    @case ('solve') { <app-solve-view /> }
    @case ('race') { <app-race-view /> }
    @case ('play') { <app-play-view /> }
    @case ('graph') { <app-search-view /> }
  }
</main>
